[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateful-llm-compiler"
version = "0.1.0"
description = "A research compiler for dynamic, stateful LLM serving workloads"
requires-python = ">=3.10"
dependencies = ["torch>=2.8"]

[project.scripts]
stateful-llm-export = "stateful_llm_compiler.frontend:main"

[tool.setuptools.packages.find]
where = ["src"]

