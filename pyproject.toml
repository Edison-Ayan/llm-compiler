[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateful-llm-compiler"
version = "0.1.0"
description = "A research compiler for dynamic, stateful LLM serving workloads"
requires-python = ">=3.10"
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
gpu = ["triton>=3.3"]

[project.scripts]
stateful-llm-export = "stateful_llm_compiler.frontend:main"
stateful-llm-export-decode = "stateful_llm_compiler.stateful_frontend:main"
stateful-llm-import = "stateful_llm_compiler.importer:main"
stateful-llm-opt = "stateful_llm_compiler.optimizer:main"
stateful-llm-check = "stateful_llm_compiler.reference_check:main"
stateful-llm-check-decode = "stateful_llm_compiler.stateful_check:main"
stateful-llm-cost = "stateful_llm_compiler.cost_model:main"

[tool.setuptools.packages.find]
where = ["src"]
